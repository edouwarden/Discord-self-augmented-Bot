<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-labelledby="title desc">
  <title id="title">Discord-self-augmented-Bot mock demo</title>
  <desc id="desc">A fake Discord channel with profile pictures. alex asks the bot to delete maya's messages and repost them through a webhook with her name and avatar, but with bubbles instead. The bot proposes and reloads generated_code.py, then reposts maya's message as bubbles. Below, three pills name the other example behaviours: a dragon GIF, and a daily fake news item.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d19"/>
      <stop offset="0.55" stop-color="#0b1222"/>
      <stop offset="1" stop-color="#10172b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121b2d"/>
      <stop offset="1" stop-color="#0e1626"/>
    </linearGradient>
    <linearGradient id="discord" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5865f2"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#334155" stroke-width="1" opacity="0.14"/>
    </pattern>
  </defs>

  <style>
    .ui { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #cbd5e1; }
    .panel-title { font: 600 14px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #e2e8f0; }
    .chan { font: 600 16px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #f1f5f9; }
    .topic { font: 400 12px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #7c8aa5; }
    .name { font: 600 13px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #e2e8f0; }
    .body { font: 400 13px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #cbd5e1; }
    .body-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #cbd5e1; }
    .muted { fill: #7c8aa5; }
    .green { fill: #34d399; }
    .amber { fill: #fbbf24; }
    .violet { fill: #a78bfa; }
    .cyan { fill: #22d3ee; }
    .blurple { fill: #818cf8; }
    .red { fill: #f87171; }
    .tiny { font-size: 11px; }
    .small { font-size: 12px; }
    .badge { font: 600 10px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .live { animation: pulse 2.4s ease-in-out infinite; }
    .pill { fill: #0c1525; stroke: #26334d; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @media (prefers-reduced-motion: reduce) { .live { animation: none; } }
  </style>

  <rect width="1200" height="860" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="860" rx="26" fill="url(#grid)"/>
  <ellipse cx="180" cy="150" rx="280" ry="200" fill="#5865f2" opacity="0.09"/>
  <ellipse cx="1040" cy="640" rx="320" ry="240" fill="#8b5cf6" opacity="0.07"/>

  <!-- Discord panel -->
  <rect x="40" y="40" width="700" height="700" rx="18" fill="url(#panel)" stroke="#243149"/>
  <circle cx="64" cy="68" r="5" fill="#f87171"/>
  <circle cx="84" cy="68" r="5" fill="#fbbf24"/>
  <circle cx="104" cy="68" r="5" fill="#34d399"/>
  <text x="132" y="73" class="panel-title">friends-only</text>
  <rect x="628" y="56" width="76" height="24" rx="12" fill="#16213a" stroke="#2b3a57"/>
  <text x="666" y="72" text-anchor="middle" class="badge muted">MOCK UI</text>
  <line x1="40" y1="92" x2="740" y2="92" stroke="#243149"/>

  <text x="70" y="120" class="chan"># sandbox</text>
  <text x="180" y="120" class="topic">self-rewrite demo · nothing executes</text>
  <circle cx="704" cy="115" r="4" fill="#34d399" class="live"/>
  <text x="694" y="120" text-anchor="end" class="tiny green">live</text>
  <line x1="40" y1="136" x2="740" y2="136" stroke="#243149"/>

  <!-- 1. command -->
  <circle cx="78" cy="180" r="16" fill="#4f46e5" stroke="#1e1b4b" stroke-width="2"/>
  <circle cx="78" cy="175" r="5" fill="#e0e7ff"/>
  <path d="M70 188 a8 8 0 0 1 16 0 z" fill="#e0e7ff"/>
  <text x="102" y="172" class="name">alex <tspan class="tiny muted">today at 14:02</tspan></text>
  <text x="102" y="194" class="body-mono blurple">$add when maya posts, delete it and repost it</text>
  <text x="102" y="210" class="body-mono blurple">through a webhook with her face, but as bubbles</text>

  <!-- 2. proposal -->
  <circle cx="78" cy="240" r="16" fill="#1d1739" stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="78" y1="219" x2="78" y2="225" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="69" y="232" width="18" height="14" rx="3" fill="#a78bfa"/>
  <circle cx="74" cy="239" r="1.7" fill="#312e81"/>
  <circle cx="82" cy="239" r="1.7" fill="#312e81"/>
  <text x="102" y="234" class="name">self-bot <tspan class="badge" fill="#818cf8">BOT</tspan></text>
  <text x="102" y="256" class="body">Proposed <tspan class="mono small">generated_code.py</tspan></text>

  <rect x="102" y="270" width="598" height="96" rx="10" fill="#0a1120" stroke="#2b3a57"/>
  <text x="118" y="294" class="mono tiny"><tspan class="violet">async def</tspan> main(client):</text>
  <text x="118" y="314" class="mono tiny">    @client.event</text>
  <text x="118" y="334" class="mono tiny">    <tspan class="violet">async def</tspan> on_message(message):</text>
  <text x="118" y="354" class="mono tiny muted">        # maya → webhook + bubbles</text>

  <rect x="102" y="382" width="176" height="26" rx="13" fill="#0f2a24" stroke="#1f5144"/>
  <circle cx="118" cy="395" r="6" fill="#134e3a" stroke="#34d399" stroke-width="1.2"/>
  <path d="M115.2 395.2 l2 2 l3.4 -4.2" fill="none" stroke="#34d399" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="130" y="399" class="tiny green">1 · approved</text>

  <!-- 3. loaded -->
  <circle cx="78" cy="440" r="16" fill="#1d1739" stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="78" y1="419" x2="78" y2="425" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="69" y="432" width="18" height="14" rx="3" fill="#a78bfa"/>
  <circle cx="74" cy="439" r="1.7" fill="#312e81"/>
  <circle cx="82" cy="439" r="1.7" fill="#312e81"/>
  <text x="102" y="434" class="name">self-bot <tspan class="badge" fill="#818cf8">BOT</tspan></text>
  <text x="102" y="456" class="body"><tspan class="green">✓</tspan> Code loaded and running.</text>
  <text x="102" y="474" class="body-mono muted">generated_code.py replaced · reloaded</text>

  <!-- 4. original message, deleted -->
  <circle cx="78" cy="520" r="16" fill="#db2777" stroke="#831843" stroke-width="2"/>
  <circle cx="78" cy="515" r="5" fill="#fce7f3"/>
  <path d="M70 528 a8 8 0 0 1 16 0 z" fill="#fce7f3"/>
  <text x="102" y="514" class="name">maya</text>
  <text x="102" y="536" class="body" opacity="0.55" text-decoration="line-through">I made cookies for everyone</text>
  <text x="300" y="536" class="tiny red">deleted</text>
  <text x="102" y="554" class="tiny muted">original message</text>

  <!-- 5. webhook replacement, same identity -->
  <circle cx="78" cy="608" r="16" fill="#db2777" stroke="#831843" stroke-width="2"/>
  <circle cx="78" cy="603" r="5" fill="#fce7f3"/>
  <path d="M70 616 a8 8 0 0 1 16 0 z" fill="#fce7f3"/>
  <text x="102" y="602" class="name">maya <tspan class="badge" fill="#fbbf24">WEBHOOK</tspan></text>
  <g fill="#38bdf8">
    <circle cx="112" cy="625" r="6"/>
    <circle cx="134" cy="625" r="6"/>
    <circle cx="156" cy="625" r="6"/>
    <circle cx="178" cy="625" r="6"/>
    <circle cx="200" cy="625" r="6"/>
  </g>
  <g fill="#e0f2fe" opacity="0.9">
    <circle cx="110.5" cy="623" r="2"/>
    <circle cx="132.5" cy="623" r="2"/>
    <circle cx="154.5" cy="623" r="2"/>
    <circle cx="176.5" cy="623" r="2"/>
    <circle cx="198.5" cy="623" r="2"/>
  </g>
  <text x="102" y="650" class="tiny muted">same name and avatar · text replaced with bubbles</text>

  <!-- Composer -->
  <rect x="64" y="672" width="652" height="52" rx="14" fill="#1a2335" stroke="#2b3a57"/>
  <circle cx="88" cy="698" r="12" fill="#26334d"/>
  <text x="88" y="703" text-anchor="middle" class="name muted">+</text>
  <text x="110" y="703" class="body muted">Message #sandbox</text>
  <circle cx="688" cy="698" r="14" fill="#5865f2"/>
  <path d="M683 703 L693 698 L683 693" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Explanation panel -->
  <rect x="770" y="40" width="390" height="700" rx="18" fill="url(#panel)" stroke="#243149"/>
  <text x="798" y="88" class="chan">What just happened</text>
  <text x="798" y="110" class="topic">one message, one reaction</text>
  <line x1="790" y1="128" x2="1140" y2="128" stroke="#243149"/>

  <g class="body">
    <circle cx="806" cy="162" r="12" fill="#16213a" stroke="#2b3a57"/>
    <text x="806" y="166" text-anchor="middle" class="tiny blurple">1</text>
    <text x="828" y="158" class="body">The model rewrote</text>
    <text x="828" y="178" class="body-mono muted">generated_code.py</text>

    <circle cx="806" cy="226" r="12" fill="#16213a" stroke="#2b3a57"/>
    <text x="806" y="230" text-anchor="middle" class="tiny blurple">2</text>
    <text x="828" y="222" class="body">ast.parse checked</text>
    <text x="828" y="242" class="body-mono muted">async def main(client)</text>

    <circle cx="806" cy="290" r="12" fill="#16213a" stroke="#2b3a57"/>
    <text x="806" y="294" text-anchor="middle" class="tiny blurple">3</text>
    <text x="828" y="286" class="body">Old file copied to</text>
    <text x="828" y="306" class="body-mono muted">generated_code_backup.py</text>

    <circle cx="806" cy="354" r="12" fill="#16213a" stroke="#2b3a57"/>
    <text x="806" y="358" text-anchor="middle" class="tiny blurple">4</text>
    <text x="828" y="350" class="body">New module imported,</text>
    <text x="828" y="370" class="body-mono muted">on_message replaced</text>

    <circle cx="806" cy="418" r="12" fill="#0f2a24" stroke="#1f5144"/>
    <text x="806" y="422" text-anchor="middle" class="tiny green">5</text>
    <text x="828" y="414" class="body">The check mark was</text>
    <text x="828" y="434" class="body-mono muted">the only approval step</text>
  </g>

  <line x1="790" y1="470" x2="1140" y2="470" stroke="#243149"/>

  <rect x="794" y="490" width="342" height="120" rx="12" fill="#1c1410" stroke="#5b3a12"/>
  <text x="812" y="518" class="name" fill="#fbbf24">No sandbox</text>
  <text x="812" y="544" class="body small">The new file runs inside the</text>
  <text x="812" y="564" class="body small">bot process, with the bot's</text>
  <text x="812" y="584" class="body small">token and permissions.</text>

  <text x="798" y="650" class="body">$undo restores the backup.</text>
  <text x="798" y="674" class="body">$change and $remove work the same way.</text>

  <text x="798" y="710" class="tiny muted">Scripted mock-up · nothing executes · MIT</text>

  <!-- Other example behaviours -->
  <g class="tiny">
    <rect x="40" y="770" width="330" height="34" rx="17" class="pill"/>
    <text x="58" y="792" class="body small"><tspan class="green">●</tspan>  maya's text → bubbles via webhook</text>

    <rect x="390" y="770" width="330" height="34" rx="17" class="pill"/>
    <text x="408" y="792" class="body small"><tspan class="amber">●</tspan>  &quot;dragon&quot; → dragon gif</text>

    <rect x="740" y="770" width="420" height="34" rx="17" class="pill"/>
    <text x="758" y="792" class="body small"><tspan class="violet">●</tspan>  daily fake news about a random member · 01:00–22:00</text>
  </g>

  <text x="1160" y="845" text-anchor="end" class="tiny muted">MIT · archived prototype</text>
</svg>
